
name: Unity Build Pipeline with CLI

on:
  workflow_dispatch: # 手動実行用ボタン

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Ensure Directories Exist
        run: |
          mkdir -p Library
          mkdir -p $HOME/.local/share/unity

      # 修正: Unity CLIがエディタを格納する標準的なディレクトリ（~/.local/share/unity または /root/.local/share/unity など）を正確に指定
      - name: Cache Unity Editor
        uses: actions/cache@v3
        with:
         path: |
          ~/.local/bin/unity
          ~/.local/share/unity
         key: unity-editor-6000.2.10f1-${{ runner.os }}-${{ hashFiles('**/ProjectSettings/ProjectVersion.txt') }}
         restore-keys: |
           unity-editor-6000.2.10f1-${{ runner.os }}-
           unity-editor-

      # 2. Project Libraryのキャッシュ
      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Install Unity CLI & Editor (Cached if exists)
        run: |
          if ! command -v unity &> /dev/null; then
            curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_CHANNEL=beta bash
          fi
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          
          # キャッシュが復元されていれば、ここは一瞬で完了するはず！
          unity install 6000.2.10f1 -m android webgl --accept-eula --yes

      - name: Run Unity Build via Batch Mode
        run: |
          echo "🚀 Unityのパスを動的に解決してビルドを開始するよ！"
          export PATH="$HOME/.local/bin:$PATH"

          UNITY_EDITOR_PATH=$(unity editors --format json | grep -o '"path":"[^"]*' | head -1 | cut -d'"' -f4)
          
          if [ -z "$UNITY_EDITOR_PATH" ]; then
            UNITY_EDITOR_PATH="$HOME/.local/share/unity/editors/6000.2.10f1/Editor/Unity"
          fi

          echo "📍 使用するUnityエディタ: $UNITY_EDITOR_PATH"

          "$UNITY_EDITOR_PATH" \
            -batchmode \
            -quit \
            -projectPath "$(pwd)" \
            -executeMethod BuildScript.BuildWebGL \
            -logFile build.log || true

          if [ -f build.log ]; then
            cat build.log
          fi

      - name: Cleanup and Commit
        run: |
          git config user.name "Gemini-Bot"
          git config user.email "bot@example.com"
          git add .
          git commit -m "Build completed: WebGL build and artifacts generated ✨" || echo "No changes to commit"
          git push
        continue-on-error: true
