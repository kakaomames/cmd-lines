name: Unity Install

on:
  workflow_dispatch: # 手動実行用

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Unity
        run: |
          curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_CHANNEL=beta bash
          unity install 6000.2.10f1 -m android webgl --accept-eula --yes

      - name: Compile C++ to WASM for Unity
        run: |
          echo "まだテストのためTODOとします"
            
      - name: Cleanup and Commit
        run: |
          git config user.name "Gemini-Bot"
          git config user.email "bot@example.com"
          git add .
          git commit -m "Build completed: engine.wasm generated and /c/ cleaned ✨"
          git push
