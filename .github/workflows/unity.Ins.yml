name: Unity Build Pipeline with CLI

on:
  workflow_dispatch: # 手動実行用ボタン

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Ensure Directories Exist
        run: |
          mkdir -p Library
          mkdir -p $HOME/.local/share/unity # Unityエディタやモジュールの保存先になりやすいパスの確保

      # 1. Unityエディタ本体のキャッシュ
      - name: Cache Unity Editor
        uses: actions/cache@v3
        with:
          path: |
            $HOME/.local/bin/unity
            $HOME/.local/share/unity
            /opt/unity
          key: unity-editor-6000.2.10f1-${{ runner.os }}
          restore-keys: |
            unity-editor-

      # 2. Project Libraryのキャッシュ
      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Install Unity CLI & Editor (Cached if exists)
        run: |
          # まだインストールされていなければCLIを入れてインストールを実行（キャッシュがあればスキップ/高速化される）
          if ! command -v unity &> /dev/null; then
            curl -fsSL https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh | UNITY_CLI_CHANNEL=beta bash
          fi
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          export PATH="$HOME/.local/bin:$PATH"
          
          # すでにキャッシュされていればこのコマンドは一瞬で終わるはず！
          unity install 6000.2.10f1 -m android webgl --accept-eula --yes

      - name: Run Unity Build via CLI
        run: |
          echo "🚀 Unityエディタによるビルド処理を開始するよ！"
          export PATH="$HOME/.local/bin:$PATH"
          
          unity build --projectPath . --buildTarget WebGL --outputPath Build/WebGL
          
          echo "✨ ビルドが完了したぞ！"

      - name: Cleanup and Commit
        run: |
          git config user.name "Gemini-Bot"
          git config user.email "bot@example.com"
          git add .
          git commit -m "Build completed: WebGL build and artifacts generated ✨" || echo "No changes to commit"
          git push
        continue-on-error: true
