<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        button, select {
            padding: 10px 20px;
            font-size: 14px;
            cursor: pointer;
            background-color: #222;
            color: #0f0;
            border: 1px solid #0f0;
            font-family: inherit;
            font-weight: bold;
            border-radius: 4px;
            outline: none;
        }

        button:hover {
            background-color: #0f0;
            color: #000;
        }

        select {
            display: none;
            background-color: #222;
            color: #fff;
        }

        #status {
            font-size: 12px;
            color: #888;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            display: none;
            background: #000;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 100;
        }
    </style>
</head>
