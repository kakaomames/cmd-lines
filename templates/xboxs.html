<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Portal</title>
    <style>
        body { margin: 0; background-color: #0d0d0d; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; overflow: hidden; }
        .box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 1px solid #00ff00; padding: 30px; background: #000; box-shadow: 0 0 15px rgba(0,255,0,0.2); z-index: 10; }
        button { padding: 12px 25px; font-size: 16px; cursor: pointer; background-color: #000; color: #00ff00; border: 1px solid #00ff00; font-family: inherit; font-weight: bold; }
        button:hover { background-color: #00ff00; color: #000; }
        #status { margin-top: 15px; color: #888; font-size: 14px; }
        /* 映像を画面いっぱいに表示し、余計なスクロールを消す */
        video { width: 100vw; height: 100vh; object-fit: contain; display: none; background: #000; position: absolute; top: 0; left: 0; z-index: 1; }
    </style>
</head>
<body>

    <!-- 操作用UIレイヤー -->
    <div id="ui-layer" class="box">
        <h2>STEALTH CLIENT v2.2</h2>
        <hr style="border-color: #00ff00;">
        <br>
        <button id="main-btn" onclick="executeProcess()">INITIALIZE AUTHENTICATION</button>
        <p id="status">SYSTEM READY</p>
    </div>

    <!-- 極論である、ゲーム映像受信用のvideoタグ -->
    <video id="game-video" autoplay playsinline></video>

    <script>
        // パスは固定。URLはPython側で自動合成されたものを安全に注入
        const loginUrl = "/xbox-login";
        const xboxUrl = "/xbox";
        const msalUrl = "{{ msal_url }}"; 
        const msAuthority = "{{ ms_auth_url }}";

        let msalClient = null;
        let currentStep = "load_lib";
        let peerConnection = null;

        const setStatus = (msg) => document.getElementById('status').innerText = msg;
        const setBtnText = (msg) => document.getElementById('main-btn').innerText = msg;
        
        const showGameVideo = () => {
            document.getElementById('ui-layer').style.display = 'none';
            document.getElementById('game-video').style.display = 'block';
        };

        // ヘッドレスでScriptタグを挿入
        function injectScript(url, callback) {
            const script = document.createElement('script');
            script.type = 'text/javascript';
            script.src = url;
            script.onload = callback;
            script.onerror = () => setStatus("LIB INJECTION FAILED.");
            document.head.appendChild(script);
        }

        // メイン処理のシーケンス制御
        async function executeProcess() {
            if (currentStep === "load_lib") {
                setStatus("INJECTING DEPENDENCIES...");
                injectScript(msalUrl, () => {
                    const msalConfig = {
                        auth: {
                            clientId: "4529e704-ca02-4ee3-9e45-e6a8e4dfdf83", 
                            authority: msAuthority
                        }
                    };
                    msalClient = new msal.PublicClientApplication(msalConfig);
                    setStatus("DEPENDENCIES INJECTED.");
                    setBtnText("AUTHENTICATE VIA MICROSOFT");
                    currentStep = "login";
                });
            }
            else if (currentStep === "login") {
                setStatus("OPENING SECURE POPUP...");
                try {
                    const loginResponse = await msalClient.loginPopup({
                        scopes: ["XboxLive.signin", "XboxLive.offline_access"]
                    });
                    
                    setStatus("TRANSMITTING TOKEN...");
                    const res = await fetch(loginUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: loginResponse.accessToken })
                    });
                    
                    if (res.ok) {
                        setStatus("AUTHENTICATION SUCCESSFUL.");
                        setBtnText("LAUNCH GAME (FORTNITE)");
                        currentStep = "play";
                    } else {
                        setStatus("SERVER REJECTED SESSION.");
                    }
                } catch (err) {
                    setStatus("AUTH ERROR: " + err);
                }
            } 
            else if (currentStep === "play") {
                setStatus("REQUESTING XCLOUD SESSION...");
                try {
                    const res = await fetch(xboxUrl, { method: 'POST' });
                    const data = await res.json();
                    
                    if (data.error) {
                        setStatus("LAUNCH FAILED: " + data.error);
                        return;
                    }
                    
                    setStatus("WEBRTC HANDSHAKING...");
                    // バックエンドから届いた本物のSDPを使ってハンドシェイク開始
                    setupWebRTC(data.sdp);
                } catch (err) {
                    setStatus("NETWORK ERROR: " + err);
                }
            }
        }

        // =============================================================
        // 【核心】本物のSDPを用いたWebRTCハンドシェイク処理
        // =============================================================
        async function setupWebRTC(serverSdp) {
            try {
                // 1. WebRTCのコネクションを初期化
                peerConnection = new RTCPeerConnection({
                    iceServers: [{ urls: 'stun:://google.com' }] // 最小限のSTUNサーバー
                });

                // 2. Azureからゲームの映像/音声トラックが届いた時の処理
                peerConnection.ontrack = (event) => {
                    const videoTag = document.getElementById('game-video');
                    // 届いた生の映像ストリームをそのままvideoタグに流し込む！
                    if (videoTag.srcObject !== event.streams[0]) {
                        videoTag.srcObject = event.streams[0];
                        showGameVideo(); // 画面をゲーム表示に切り替え
                        setStatus("STREAM ACTIVE");
                    }
                };

                // 3. コントローラー/キーボード操作を送受信するデータチャンネルを準備
                const dataChannel = peerConnection.createDataChannel("input", { ordered: false });
                dataChannel.onopen = () => console.log("DataChannel opened. Ready for inputs.");

                // 4. Azure（Xbox）側から届いた「オファーSDP」を自分のリモート設定に登録
                await peerConnection.setRemoteDescription(new RTCSessionDescription({
                    type: 'offer',
                    sdp: serverSdp
                }));

                // 5. 自分の環境に合わせた「アンサーSDP」を生成して登録
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                // 6. [補足] 本来は生成したanswer.sdpを再度Flask経由でAzureにパッシング（ネゴシエーション完了）
                console.log("Local Answer SDP created. Connecting to Azure...");

            } catch (e) {
                setStatus("WEBRTC ERROR: " + e);
            }
        }
    </script>
</body>
</html>
