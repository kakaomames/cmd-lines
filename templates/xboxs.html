<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XCloud Stealth Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.16.0/lib/msal-browser.min.js"></script>
    <style>
        :root {
            --bg-color: #050508;
            --panel-bg: rgba(10, 10, 18, 0.85);
            --accent-green: #00ff66;
            --accent-glow: rgba(0, 255, 102, 0.3);
            --text-dim: #8892b0;
        }

        body {
            margin: 0;
            background-color: var(--bg-color);
            color: var(--accent-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            width: 200vw;
            height: 200vh;
            background-image: linear-gradient(rgba(0,255,102,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,255,102,0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        .dashboard {
            background: var(--panel-bg);
            border: 1px solid var(--accent-green);
            box-shadow: 0 0 30px var(--accent-glow);
            padding: 40px;
            width: 420px;
            box-sizing: border-box;
            border-radius: 6px;
            text-align: left;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .header-title {
            font-size: 18px;
            letter-spacing: 2px;
            margin-bottom: 5px;
            color: #fff;
            text-shadow: 0 0 8px var(--accent-glow);
        }

        .header-sub {
            font-size: 12px;
            color: var(--text-dim);
            margin-bottom: 25px;
            text-transform: uppercase;
        }

        .control-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        button, select {
            width: 100%;
            padding: 14px 20px;
            font-size: 14px;
            cursor: pointer;
            background-color: #000;
            color: var(--accent-green);
            border: 1px solid var(--accent-green);
            font-family: inherit;
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-sizing: border-box;
            border-radius: 4px;
            outline: none;
        }

        button:hover:not(:disabled) {
            background-color: var(--accent-green);
            color: #000;
            box-shadow: 0 0 15px var(--accent-green);
        }

        select {
            display: none;
            background-color: #08080f;
            color: #fff;
            margin-bottom: 15px;
        }

        select option {
            background: #08080f;
            color: #fff;
        }

        .status-box {
            margin-top: 25px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            border-left: 3px solid var(--accent-green);
            font-size: 12px;
            color: #a8b2d1;
            letter-spacing: 0.5px;
        }

        video {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
            display: none;
            background: #000;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="ui-layer" class="dashboard">
        <div class="header-title">STEALTH CLIENT // XCLOUD</div>
        <div class="header-sub">Secure Terminal Interface v2.5</div>
        <hr
