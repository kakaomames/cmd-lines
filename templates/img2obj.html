<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Meshy 3D 生成クライアント</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            background: #1e1e1e;
            color: #fff;
        }
        .card {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        input, button {
            margin-top: 10px;
            margin-bottom: 10px;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }
        button:hover {
            background: #45a049;
        }
        #status {
            margin-top: 15px;
            padding: 10px;
            background: #333;
            border-radius: 4px;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🎨 Image to 3D 生成ツール</h2>
        <label for="imageFile">変換したい画像を選択:</label>
        <input type="file" id="imageFile" accept="image/*">
        <button onclick="uploadAndGenerate()">🚀 3D生成スタート！</button>
        
        <h3>📊 処理ステータス:</h3>
        <div id="status">待機中...</div>
    </div>

    <script>
    async function uploadAndGenerate() {
        const fileInput = document.getElementById('imageFile');
        const statusDiv = document.getElementById('status');

        if (fileInput.files.length === 0) {
            alert('画像ファイルを選択してください！');
            return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
            // 1. /up-img でMeshyのストレージへアップロード
            statusDiv.innerText = '1/3: 画像をアップロード中...';
            const upRes = await fetch('/up-img', {
                method: 'POST',
                body: formData
            });
            const upData = await upRes.json();
            
            if (!upRes.ok || !upData.success) {
                throw new Error('アップロード失敗: ' + JSON.stringify(upData));
            }

            const imageUrl = upData.image_url;
            statusDiv.innerText = '2/3: アップロード成功！3D生成タスクを送信中...';

            // 2. /s-obj で3D生成タスクをキック
            const genRes = await fetch('/s-obj', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image_url: imageUrl })
            });
            const genData = await genRes.json();
            
            if (!genRes.ok) {
                throw new Error('生成タスクの開始に失敗: ' + JSON.stringify(genData));
            }

            // MeshyのAPIレスポンス構造（resultにtask_idが入る）
            const taskId = genData.result;
            statusDiv.innerText = `3/3: 生成中... (Task ID: ${taskId})`;

            // 3. /objS でステータスを定期確認 (ポーリング)
            const interval = setInterval(async () => {
                try {
                    const statusRes = await fetch(`/objS?task_id=${taskId}`);
                    const statusData = await statusRes.json();
                    
                    const taskInfo = statusData.result || statusData;
                    const state = taskInfo.status || 'PROCESSING';
                    const progress = taskInfo.progress || 0;

                    statusDiv.innerText = `生成ステータス: ${state} (${progress}%)`;

                    if (state === 'SUCCEEDED') {
                        clearInterval(interval);
                        statusDiv.innerHTML = `🎉 3D生成完了！<br>モデルURL: <a href="${taskInfo.model_urls.glb}" target="_blank" style="color: #4CAF50;">GLBファイルをダウンロード</a>`;
                    } else if (state === 'FAILED') {
                        clearInterval(interval);
                        statusDiv.innerText = '❌ 3D生成に失敗しました。';
                    }
                } catch (err) {
                    console.error('ステータス取得エラー:', err);
                }
            }, 3000); // 3秒ごとにチェック

        } catch (error) {
            statusDiv.innerText = 'エラー発生: ' + error.message;
            console.error(error);
        }
    }
    </script>

</body>
</html>
